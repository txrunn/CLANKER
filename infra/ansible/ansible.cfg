# Operator-side Ansible configuration. Selected via ANSIBLE_CONFIG (set by
# bin/hermit.hcl). Inventory and host vars are rendered by Terraform into
# infra/.generated/<env>/ and passed explicitly by the justfile.

[defaults]
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
forks = 5
stdout_callback = ansible.builtin.default
callback_result_format = yaml
display_skipped_hosts = False
any_errors_fatal = True

[privilege_escalation]
become_method = sudo

[ssh_connection]
# Pipelining lets tasks become an unprivileged tenant user without
# world-readable temp files.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
