---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Migrate podman storage
  # Picks up changed subordinate ID ranges for every tenant.
  ansible.builtin.command:
    cmd: podman system migrate
  become: true
  become_user: "svc-{{ item }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ spark_tenants[item].uid }}"
  args:
    chdir: /
  loop: "{{ spark_tenants.keys() | list }}"
  changed_when: true
