---
# Inverse of main.yml. The CDI spec stays: DGX OS may have shipped it, and
# other GPU containers on the host may rely on it.
- name: Remove containers drop-ins
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/containers/registries.conf.d/50-spark.conf
    - /etc/containers/containers.conf.d/50-spark.conf
