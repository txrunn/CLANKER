---
# Podman secrets have no update operation, so the key's SHA-256 is stored as
# a label and the secret is only replaced when the key in .env changes.
- name: Hash the API key
  ansible.builtin.set_fact:
    inference_platform_key_sha: "{{ lookup('ansible.builtin.env', inference_platform_api_key_env) | hash('sha256') }}"
  no_log: true

- name: Read the stored secret's hash
  ansible.builtin.command:
    cmd: podman secret inspect --format '{{ '{{' }} index .Spec.Labels "sha256" {{ '}}' }}' {{ inference_platform_secret_name }}
    chdir: /
  register: inference_platform_secret_label
  changed_when: false
  failed_when: false

- name: Create or rotate the secret
  when: inference_platform_secret_label.stdout | trim != inference_platform_key_sha
  ansible.builtin.command:
    cmd: >-
      podman secret create --replace
      --label sha256={{ inference_platform_key_sha }}
      {{ inference_platform_secret_name }} -
    stdin: "{{ lookup('ansible.builtin.env', inference_platform_api_key_env) }}"
    stdin_add_newline: false
    chdir: /
  no_log: true
  changed_when: true
  notify: Restart all inference models
