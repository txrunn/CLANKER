# Shared by `just lint-ansible` and ansible-lint (which reads this file).
extends: default
rules:
  line-length:
    max: 160
  document-start: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
